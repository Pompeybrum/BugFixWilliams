<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Bug Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-secondary: #f5f5f4;
    --bg-tertiary: #f0efed;
    --text: #1a1a18;
    --text-secondary: #6b6b67;
    --text-tertiary: #9b9b97;
    --border: rgba(0,0,0,0.12);
    --border-md: rgba(0,0,0,0.2);
    --radius-md: 8px;
    --radius-lg: 12px;
    --red: #E24B4A;
    --red-hover: #c93d3c;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1c;
      --bg-secondary: #2a2a28;
      --bg-tertiary: #252523;
      --text: #f0efed;
      --text-secondary: #a0a09c;
      --text-tertiary: #6b6b67;
      --border: rgba(255,255,255,0.1);
      --border-md: rgba(255,255,255,0.2);
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg-tertiary);
    color: var(--text);
    min-height: 100vh;
    padding: 1.5rem;
  }

  .app {
    max-width: 780px;
    margin: 0 auto;
    background: var(--bg);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    overflow: hidden;
  }

  .header {
    padding: 1.5rem 1.5rem 1rem;
    border-bottom: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px; height: 40px; border-radius: var(--radius-md);
    background: var(--red); display: flex; align-items: center;
    justify-content: center; color: white; font-size: 20px; flex-shrink: 0;
  }
  .title { font-size: 17px; font-weight: 600; color: var(--text); }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .stats { display: flex; gap: 8px; align-items: center; }
  .stat-pill {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    border: 0.5px solid var(--border-md);
    color: var(--text-secondary); white-space: nowrap;
  }
  .stat-pill span { font-weight: 600; color: var(--text); }
  .sync-btn {
    background: none; border: 0.5px solid var(--border-md);
    border-radius: 999px; padding: 4px 10px; font-size: 12px;
    color: var(--text-secondary); cursor: pointer; font-family: inherit;
    transition: all 0.15s;
  }
  .sync-btn:hover { background: var(--bg-secondary); color: var(--text); }
  .sync-btn.spinning { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .add-section {
    padding: 1rem 1.5rem;
    border-bottom: 0.5px solid var(--border);
  }
  .add-toggle {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-secondary);
    cursor: pointer; padding: 6px 0;
    background: none; border: none; width: 100%; text-align: left;
    transition: color 0.15s; font-family: inherit;
  }
  .add-toggle:hover { color: var(--text); }
  .add-form { display: none; margin-top: 12px; }
  .add-form.open { display: block; }

  .form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .form-col { flex: 1; min-width: 140px; }
  label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 4px; }
  input[type="text"], textarea, select {
    width: 100%; padding: 8px 10px; font-size: 13px;
    border: 0.5px solid var(--border-md);
    border-radius: var(--radius-md);
    background: var(--bg); color: var(--text);
    font-family: inherit; transition: border-color 0.15s;
  }
  textarea { resize: vertical; min-height: 64px; }
  input[type="text"]:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(226,75,74,0.12);
  }

  .upload-zone {
    border: 1.5px dashed var(--border-md);
    border-radius: var(--radius-md);
    padding: 20px 16px; text-align: center; cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    background: var(--bg-secondary); position: relative;
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--red); background: var(--bg);
  }
  .upload-zone input {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .upload-zone .uz-icon { font-size: 28px; margin-bottom: 4px; display: block; }
  .upload-zone p { font-size: 12px; color: var(--text-secondary); pointer-events: none; }
  .upload-zone p:first-of-type { font-weight: 500; color: var(--text); }
  .upload-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .preview-thumb {
    width: 60px; height: 50px; border-radius: var(--radius-md);
    object-fit: cover; border: 0.5px solid var(--border);
    cursor: pointer; transition: opacity 0.15s;
  }
  .preview-thumb:hover { opacity: 0.75; }

  .form-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .btn-cancel {
    padding: 8px 14px; font-size: 13px; border-radius: var(--radius-md);
    border: 0.5px solid var(--border-md);
    background: none; color: var(--text-secondary); cursor: pointer;
    font-family: inherit; transition: background 0.15s;
  }
  .btn-cancel:hover { background: var(--bg-secondary); }
  .btn-submit {
    padding: 8px 16px; font-size: 13px; border-radius: var(--radius-md);
    border: none; background: var(--red); color: white; cursor: pointer;
    font-weight: 600; font-family: inherit; transition: background 0.15s;
  }
  .btn-submit:hover { background: var(--red-hover); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

  .filters {
    padding: 10px 1.5rem;
    display: flex; gap: 8px; flex-wrap: wrap;
    border-bottom: 0.5px solid var(--border);
  }
  .filter-btn {
    padding: 5px 12px; font-size: 12px; border-radius: 999px;
    border: 0.5px solid var(--border-md);
    background: none; color: var(--text-secondary); cursor: pointer;
    font-family: inherit; transition: all 0.15s;
  }
  .filter-btn:hover { background: var(--bg-secondary); color: var(--text); }
  .filter-btn.active { background: var(--red); color: white; border-color: var(--red); }

  .bugs-list { padding: 0.75rem 1.5rem 1.5rem; }
  .empty-state {
    text-align: center; padding: 3rem 1rem;
    color: var(--text-secondary); font-size: 14px;
  }
  .empty-icon { font-size: 40px; display: block; margin-bottom: 10px; opacity: 0.35; }

  .loading-state {
    text-align: center; padding: 2rem; color: var(--text-secondary); font-size: 13px;
  }

  .bug-card {
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    margin-bottom: 10px; background: var(--bg);
    transition: border-color 0.15s; overflow: hidden;
  }
  .bug-card:hover { border-color: var(--border-md); }
  .bug-card.resolved { opacity: 0.5; }

  .bug-top { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; }
  .bug-checkbox {
    width: 20px; height: 20px; border-radius: 50%;
    border: 1.5px solid var(--border-md);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; margin-top: 1px;
    transition: all 0.15s; background: none;
  }
  .bug-checkbox:hover { border-color: #22c55e; }
  .bug-checkbox.checked { background: #22c55e; border-color: #22c55e; color: white; }

  .bug-body { flex: 1; min-width: 0; }
  .bug-title { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.4; margin-bottom: 3px; }
  .bug-card.resolved .bug-title { text-decoration: line-through; color: var(--text-tertiary); }
  .bug-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 6px; }
  .bug-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .priority-badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 500; }
  .priority-critical { background: #FCEBEB; color: #A32D2D; }
  .priority-high { background: #FAEEDA; color: #854F0B; }
  .priority-medium { background: #E6F1FB; color: #185FA5; }
  .priority-low { background: #EAF3DE; color: #3B6D11; }

  .category-tag {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--bg-secondary); color: var(--text-secondary);
    border: 0.5px solid var(--border);
  }
  .bug-date { font-size: 11px; color: var(--text-tertiary); margin-left: auto; }

  .bug-screenshots { display: flex; gap: 6px; padding: 0 14px 12px 46px; flex-wrap: wrap; }
  .ss-thumb {
    width: 72px; height: 54px; border-radius: var(--radius-md);
    object-fit: cover; border: 0.5px solid var(--border);
    cursor: pointer; transition: opacity 0.15s;
  }
  .ss-thumb:hover { opacity: 0.75; }
  .ss-more {
    width: 72px; height: 54px; border-radius: var(--radius-md);
    border: 0.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--text-secondary);
    cursor: pointer; background: var(--bg-secondary);
  }
  .ss-more:hover { background: var(--bg); }

  .bug-actions { flex-shrink: 0; }
  .action-btn {
    background: none; border: none; cursor: pointer; padding: 5px;
    color: var(--text-tertiary); border-radius: var(--radius-md);
    transition: all 0.15s; font-size: 16px;
  }
  .action-btn:hover { color: var(--text-secondary); background: var(--bg-secondary); }
  .action-btn.delete:hover { color: var(--red); }

  .lightbox {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.88); z-index: 1000;
    align-items: center; justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 92vh; border-radius: var(--radius-lg); object-fit: contain; }
  .lightbox-close {
    position: absolute; top: 16px; right: 16px;
    background: rgba(255,255,255,0.15); border: none; color: white;
    width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
    font-size: 20px; display: flex; align-items: center; justify-content: center;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.25); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg);
    border-radius: var(--radius-md); padding: 10px 18px; font-size: 13px;
    display: none; white-space: nowrap; z-index: 999; font-weight: 500;
  }
  .toast.show { display: block; animation: fadeUp 0.2s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateX(-50%) translateY(6px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <div class="header-left">
      <div class="logo">🐛</div>
      <div>
        <div class="title">Game Bug Tracker</div>
        <div class="subtitle" id="subtitle">Loading...</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat-pill">Open: <span id="count-open">0</span></div>
      <div class="stat-pill">Fixed: <span id="count-fixed">0</span></div>
      <button class="sync-btn" onclick="loadBugs()" title="Refresh">↻ Refresh</button>
    </div>
  </div>

  <div class="add-section">
    <button class="add-toggle" id="add-toggle" onclick="toggleForm()">
      ＋ Report a new bug
    </button>
    <div class="add-form" id="add-form">
      <div class="form-row">
        <div class="form-col" style="flex:2">
          <label for="f-title">Bug title *</label>
          <input type="text" id="f-title" placeholder="e.g. Player falls through floor on level 3" />
        </div>
        <div class="form-col">
          <label for="f-priority">Priority</label>
          <select id="f-priority">
            <option value="critical">🔴 Critical</option>
            <option value="high">🟠 High</option>
            <option value="medium" selected>🔵 Medium</option>
            <option value="low">🟢 Low</option>
          </select>
        </div>
        <div class="form-col">
          <label for="f-category">Category</label>
          <select id="f-category">
            <option value="Gameplay">Gameplay</option>
            <option value="Graphics">Graphics</option>
            <option value="Audio">Audio</option>
            <option value="UI">UI</option>
            <option value="Crash">Crash</option>
            <option value="Physics">Physics</option>
            <option value="Network">Network</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <div style="margin-bottom:10px">
        <label for="f-desc">Description</label>
        <textarea id="f-desc" placeholder="Steps to reproduce, what happened vs what was expected..."></textarea>
      </div>
      <div style="margin-bottom:12px">
        <label>Screenshots</label>
        <div class="upload-zone" id="drop-zone">
          <input type="file" id="f-files" accept="image/*" multiple onchange="handleFiles(this.files)" />
          <span class="uz-icon">📸</span>
          <p>Drop screenshots here or click to browse</p>
          <p>PNG, JPG, GIF — multiple files OK</p>
        </div>
        <div class="upload-preview" id="upload-preview"></div>
      </div>
      <div class="form-footer">
        <button class="btn-cancel" onclick="cancelForm()">Cancel</button>
        <button class="btn-submit" id="btn-submit" onclick="submitBug()">🐛 Log bug</button>
      </div>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('open',this)">Open</button>
    <button class="filter-btn" onclick="setFilter('resolved',this)">Fixed</button>
    <button class="filter-btn" onclick="setFilter('critical',this)">Critical</button>
    <button class="filter-btn" onclick="setFilter('high',this)">High</button>
    <button class="filter-btn" onclick="setFilter('Gameplay',this)">Gameplay</button>
    <button class="filter-btn" onclick="setFilter('Graphics',this)">Graphics</button>
    <button class="filter-btn" onclick="setFilter('Crash',this)">Crash</button>
  </div>

  <div class="bugs-list" id="bugs-list">
    <div class="loading-state">Loading bugs...</div>
  </div>

</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="Bug screenshot" />
</div>
<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://nbrususucbddovauegrej.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_uWTxCQ7Dz-KEFKnKtWTOBw__Rx5NbKZ';
  const HEADERS = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_KEY
  };

  let bugs = [];
  let pendingImages = [];
  let currentFilter = 'all';

  async function api(path, options = {}) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: { ...HEADERS, ...(options.headers || {}) },
      ...options
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(err);
    }
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  async function loadBugs() {
    document.getElementById('subtitle').textContent = 'Syncing...';
    try {
      const data = await api('bugs?order=created_at.desc', {
        headers: { 'Prefer': 'return=representation' }
      });
      bugs = (data || []).map(row => ({
        id: row.id,
        title: row.title,
        desc: row.description || '',
        priority: row.priority || 'medium',
        category: row.category || 'Other',
        screenshots: row.screenshots ? JSON.parse(row.screenshots) : [],
        resolved: row.resolved || false,
        date: new Date(row.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
      }));
      updateStats();
      renderBugs();
    } catch(e) {
      document.getElementById('subtitle').textContent = 'Error loading bugs';
      document.getElementById('bugs-list').innerHTML = `<div class="loading-state">⚠️ Could not connect to database. Check your internet connection.</div>`;
      console.error(e);
    }
  }

  function toggleForm() {
    const f = document.getElementById('add-form');
    f.classList.toggle('open');
    const t = document.getElementById('add-toggle');
    if (f.classList.contains('open')) {
      t.textContent = '✕ Cancel';
      document.getElementById('f-title').focus();
    } else {
      t.textContent = '＋ Report a new bug';
      resetForm();
    }
  }

  function cancelForm() {
    document.getElementById('add-form').classList.remove('open');
    document.getElementById('add-toggle').textContent = '＋ Report a new bug';
    resetForm();
  }

  function resetForm() {
    document.getElementById('f-title').value = '';
    document.getElementById('f-desc').value = '';
    document.getElementById('f-priority').value = 'medium';
    document.getElementById('f-category').value = 'Gameplay';
    document.getElementById('f-files').value = '';
    pendingImages = [];
    document.getElementById('upload-preview').innerHTML = '';
  }

  function handleFiles(files) {
    Array.from(files).forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = e => {
        pendingImages.push(e.target.result);
        renderPreviews();
      };
      reader.readAsDataURL(file);
    });
  }

  function renderPreviews() {
    document.getElementById('upload-preview').innerHTML = pendingImages.map((src, i) =>
      `<img class="preview-thumb" src="${src}" alt="Preview ${i+1}" onclick="openLightbox('${src}')" />`
    ).join('');
  }

  const dz = document.getElementById('drop-zone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('drag-over');
    handleFiles(e.dataTransfer.files);
  });

  async function submitBug() {
    const title = document.getElementById('f-title').value.trim();
    if (!title) { document.getElementById('f-title').focus(); showToast('Please enter a bug title'); return; }

    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const bug = {
      id: Date.now().toString(),
      title,
      description: document.getElementById('f-desc').value.trim(),
      priority: document.getElementById('f-priority').value,
      category: document.getElementById('f-category').value,
      screenshots: JSON.stringify(pendingImages),
      resolved: false
    };

    try {
      await api('bugs', {
        method: 'POST',
        headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify(bug)
      });
      cancelForm();
      await loadBugs();
      showToast('Bug logged!');
    } catch(e) {
      showToast('Failed to save — try again');
      console.error(e);
    } finally {
      btn.disabled = false;
      btn.textContent = '🐛 Log bug';
    }
  }

  async function toggleResolved(id) {
    const bug = bugs.find(b => b.id === id);
    if (!bug) return;
    const newState = !bug.resolved;
    try {
      await api(`bugs?id=eq.${id}`, {
        method: 'PATCH',
        headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({ resolved: newState })
      });
      bug.resolved = newState;
      updateStats();
      renderBugs();
      showToast(newState ? 'Marked as fixed ✓' : 'Reopened');
    } catch(e) {
      showToast('Failed to update — try again');
    }
  }

  async function deleteBug(id) {
    if (!confirm('Delete this bug?')) return;
    try {
      await api(`bugs?id=eq.${id}`, { method: 'DELETE' });
      bugs = bugs.filter(b => b.id !== id);
      updateStats();
      renderBugs();
      showToast('Bug deleted');
    } catch(e) {
      showToast('Failed to delete — try again');
    }
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderBugs();
  }

  function getFiltered() {
    return bugs.filter(b => {
      if (currentFilter === 'all') return true;
      if (currentFilter === 'open') return !b.resolved;
      if (currentFilter === 'resolved') return b.resolved;
      if (currentFilter === 'critical') return b.priority === 'critical';
      if (currentFilter === 'high') return b.priority === 'high';
      return b.category === currentFilter;
    });
  }

  function updateStats() {
    document.getElementById('count-open').textContent = bugs.filter(b => !b.resolved).length;
    document.getElementById('count-fixed').textContent = bugs.filter(b => b.resolved).length;
    const n = bugs.length;
    document.getElementById('subtitle').textContent =
      n === 0 ? 'No bugs yet — nice!' : `${n} bug${n !== 1 ? 's' : ''} tracked`;
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderBugs() {
    const list = document.getElementById('bugs-list');
    const filtered = getFiltered();
    if (filtered.length === 0) {
      const msg = currentFilter === 'all'
        ? 'No bugs logged yet — use the button above to report one'
        : 'No bugs match this filter';
      list.innerHTML = `<div class="empty-state"><span class="empty-icon">✅</span>${msg}</div>`;
      return;
    }
    list.innerHTML = filtered.map(bug => {
      const pLabel = bug.priority.charAt(0).toUpperCase() + bug.priority.slice(1);
      let ssHtml = '';
      if (bug.screenshots && bug.screenshots.length > 0) {
        const show = bug.screenshots.slice(0, 3);
        const extra = bug.screenshots.length - 3;
        ssHtml = `<div class="bug-screenshots">
          ${show.map((src, i) => `<img class="ss-thumb" src="${src}" alt="Screenshot ${i+1}" onclick="openLightbox('${src}')" />`).join('')}
          ${extra > 0 ? `<div class="ss-more" onclick="openLightbox('${bug.screenshots[3]}')">+${extra} more</div>` : ''}
        </div>`;
      }
      return `<div class="bug-card${bug.resolved ? ' resolved' : ''}" id="bug-${bug.id}">
        <div class="bug-top">
          <button class="bug-checkbox${bug.resolved ? ' checked' : ''}"
            onclick="toggleResolved('${bug.id}')"
            title="${bug.resolved ? 'Reopen bug' : 'Mark as fixed'}">
            ${bug.resolved ? '✓' : ''}
          </button>
          <div class="bug-body">
            <div class="bug-title">${esc(bug.title)}</div>
            ${bug.desc ? `<div class="bug-desc">${esc(bug.desc)}</div>` : ''}
            <div class="bug-meta">
              <span class="priority-badge priority-${bug.priority}">${pLabel}</span>
              <span class="category-tag">${esc(bug.category)}</span>
              <span class="bug-date">${bug.date}</span>
            </div>
          </div>
          <div class="bug-actions">
            <button class="action-btn delete" onclick="deleteBug('${bug.id}')" title="Delete bug">🗑</button>
          </div>
        </div>
        ${ssHtml}
      </div>`;
    }).join('');
  }

  function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  loadBugs();

  setInterval(loadBugs, 30000);
</script>
</body>
</html>
